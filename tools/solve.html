<!doctype html><html><head><meta charset="utf-8"><style>@font-face{font-family:"Courier Prime";src:url(../fonts/CourierPrime-Bold.woff2) format('woff2');font-weight:700}body{margin:0;background:#fff}</style>
<script src="../js/engine.js"></script><script src="../js/levels.js"></script></head><body><script>
// Best-first search over the real physics: can each line be finished (with and without Shift)?
(async()=>{await document.fonts.load(SL.FONT);
const q=new URLSearchParams(location.hash.slice(1));const only=q.has('i')?+q.get('i'):null;const modes=(q.get('m')||'1,0').split(',').map(Number);
const lv0=q.has('lv')?JSON.parse(q.get('lv')):null;
const mk=(w,h)=>{const c=document.createElement('canvas');c.width=w;c.height=h;return c};
const out=[];const DT=1/120,REP=q.has("rep")?+q.get("rep"):10;
function run(L,d,a,prevJ){const inp={left:a.dir<0,right:a.dir>0,jumpHeld:!!a.j,jumpPressed:false,shift:a.s};let jam=false;
 for(let f=0;f<REP;f++){inp.jumpPressed=(f===0&&a.j&&!prevJ);const e=SL.step(L,d,inp,DT);if(e==='jam')jam=true;if(d.won||d.fell)return{ev:d.won?'win':'fall',jam};}
 return{ev:null,jam};}
const list=lv0?[{lv:lv0,i:-1}]:SLEVELS.map((lv,i)=>({lv,i})).filter(o=>only===null||o.i===only);
for(const {lv,i} of list){const L=SL.build(lv,mk);
 for(const allow of modes){
 const acts=[];for(const dir of [1,0,-1])for(const j of [0,1])for(const s of (allow===2?[1]:allow?[0,1]:[0]))acts.push({dir,j,s});
 const cp=q.has('cp')?+q.get('cp'):null;const d0=SL.newDot(L,cp);for(let f=0;f<120;f++)SL.step(L,d0,{shift:allow===2?1:0},DT);
 const key=(d,pj)=>[Math.round(d.x/3),Math.round(d.y/3),Math.round(d.vx/50),Math.round(d.vy/100),d.mode,d.ground?1:0,pj].join(',');
 const seen=new Set();let open=[{d:d0,pj:0,path:[]}];seen.add(key(d0,0));let found=null,exp=0;const t0=performance.now();
 while(open.length&&!found&&exp<1500000){open.sort((a,b)=>b.d.x-a.d.x);const batch=open.splice(0,Math.min(open.length,48));
  for(const n of batch){for(const a of acts){const d=Object.assign({},n.d);const r=run(L,d,a,n.pj);exp++;if(r.ev==='fall'||d.y+SL.P.h>L.base+45)continue;
    const path=n.path.concat([(a.dir+1)+3*a.j+6*a.s]);if(r.ev==='win'){found={path,d};break;}
    const k=key(d,a.j);if(seen.has(k))continue;seen.add(k);open.push({d,pj:a.j,path});}
   if(found)break;}
  if(open.length>20000){open.sort((a,b)=>b.d.x-a.d.x);const cnt=new Map();open=open.filter(n=>{const k=Math.round(n.d.x/24)+'|'+n.d.mode+'|'+(n.d.ground?1:0)+'|'+Math.round(n.d.y/24);const c=(cnt.get(k)||0)+1;cnt.set(k,c);return c<=40;});}}
 let shifts=0;if(found)for(let k=1;k<found.path.length;k++)if((found.path[k]>=6)!==(found.path[k-1]>=6))shifts++;
 const plan=[];if(found){plan.push([120,0,0,allow===2?1:0]);for(const v of found.path){const st=[REP,(v%3)-1,Math.floor(v/3)%2,Math.floor(v/6)];const l=plan[plan.length-1];if(plan.length>1&&l[1]===st[1]&&l[2]===st[2]&&l[3]===st[3]&&!st[2])l[0]+=REP;else plan.push(st);}}
 out.push({plan,jh:SL.P.jumpH,i,allow,text:lv.text,ok:!!found,secs:found?(found.path.length*REP*DT).toFixed(1):0,shifts,exp,ms:Math.round(performance.now()-t0),path:found?found.path.join(','):''});}}
window.R=out;document.title='DONE';})();</script></body></html>
